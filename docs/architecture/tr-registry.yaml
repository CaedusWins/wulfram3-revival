  gdd: design/gdd/hover-movement.md
  requirement: "Movement is owner-authoritative: only the owning client reads the tank's input and simulates its rigidbody; every other client keeps the tank kinematic and shows the pose PUN's view sync delivers."
  created: 2026-10-27
  revised: ""
  status: active

- id: TR-hover-movement-002
  system: hover-movement
  gdd: design/gdd/hover-movement.md
  requirement: "Hover, drive, jump, landing and take-off run on the owner's client as rigidbody forces in the physics step, using a downward ray against the TerrainCollider only (reach 2 x height; units, pads and boxes are not ground); landing makes the body kinematic, snapped to the slope, and take-off makes it simulated again."
  created: 2026-10-27
  revised: ""
  status: active

- id: TR-hover-movement-003
