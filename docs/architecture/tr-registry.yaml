# --- self-destruct.md (system slug: self-destruct) --- added 2026-10-27, architecture review 3

- id: TR-self-destruct-001
  system: self-destruct
  gdd: design/gdd/self-destruct.md
  requirement: "Only the owning client arms the self-destruct (V), on its own living tank, at most once per life; repeat presses while armed do nothing, and the arming effect is shown on every client."
  created: 2026-10-27
  revised: ""
  status: active

- id: TR-self-destruct-002
  system: self-destruct
  gdd: design/gdd/self-destruct.md
  requirement: "The blast damages only units within sphereRadius whose team is not the tank's (Unit.SameTeam; a team-less unit counts as not friendly), by ceil(maximumDamage x (sphereRadius - d) / sphereRadius), once per unit; friendly tanks, pads and turrets take no blast damage."
  created: 2026-10-27
  revised: ""
  status: active

- id: TR-self-destruct-003
  system: self-destruct
  gdd: design/gdd/self-destruct.md
  requirement: "All blast damage, including the tank's own lethal maximumDamage, is requested from the master through TellServerTakeDamage, and the master ignores it between a match's end and the reset."
  created: 2026-10-27
  revised: ""
  status: active

- id: TR-self-destruct-004
  system: self-destruct
  gdd: design/gdd/self-destruct.md
  requirement: "A self-destructed tank dies through the normal death and respawn flow and counts for the win condition like any other death."
  created: 2026-10-27
  revised: ""
  status: active

- id: TR-self-destruct-005
  system: self-destruct
  gdd: design/gdd/self-destruct.md
  requirement: "A unit the blast destroys produces its own death explosion (Explosions & Splash), whose splash is not team-filtered and is capped at splashCap; it is separate from the blast."
  created: 2026-10-27
  revised: ""
  status: active

- id: TR-self-destruct-006
  system: self-destruct
  gdd: design/gdd/self-destruct.md
  requirement: "maximumDamage (100-2000) and sphereRadius (3-20 m) are tunable within their documented ranges."
  created: 2026-10-27
  revised: ""
  status: active

- id: TR-self-destruct-007
  system: self-destruct
  gdd: design/gdd/self-destruct.md
  requirement: "The gameplay gate (6e self-destruct, self-destruct-friendly) verifies acceptance criteria 1-4."
  created: 2026-10-27
  revised: ""
  status: active

