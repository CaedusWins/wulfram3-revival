  gdd: design/gdd/hover-movement.md
  requirement: "The tank takes movement input (drive, mouse look, hover height, jump) only while it is the owner's living tank and the cursor is hidden (input mode: TR-camera-cursor-002), with no mouse look while landed; a dead tank starts the respawn flow destroyDelayWhenDead after death."
  created: 2026-10-27
  revised: ""
  status: active

- id: TR-hover-movement-004
  system: hover-movement
  gdd: design/gdd/hover-movement.md
  requirement: "Driving, aiming and hover-height changes do not depend on the frame rate (the hover height changes per second, not per rendered frame)."
  created: 2026-10-27
  revised: ""
  status: active

- id: TR-hover-movement-005
  system: hover-movement
  gdd: design/gdd/hover-movement.md
  requirement: "sensitivityX/Y (0.5-5), the pitch limits (30-89 degrees each way), fuelPerJump (0-100), timeBetweenJumps (0.5-10 s) and destroyDelayWhenDead (1-10 s) are tunable within their documented ranges."
  created: 2026-10-27
  revised: ""
  status: active

- id: TR-hover-movement-006
