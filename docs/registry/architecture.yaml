# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: raw_team_string_comparison
    status: active
    description: "Never compare raw team strings with ==, Equals or ToLower(); use Unit.SameTeam or compare Unit.NormalizeTeam output."
    why: "The 2018 data spells teams 'blue', 'Blue', 'BlueTeam'; exact comparisons made turrets ignore their enemies."
    adr: docs/architecture/adr-0003-master-authority-and-team-identity.md
    added: 2026-10-26
  - pattern: direct_health_write
    status: active
    description: "Never assign HitPointsManager.health or call TakeDamage locally; go through TellServerTakeDamage / TellServerHealth."
    why: "Only the master may change health, or clients disagree about a unit's state."
    adr: docs/architecture/adr-0003-master-authority-and-team-identity.md
    added: 2026-10-26
  - pattern: modern_unity_or_csharp
    status: active
    description: "No C# 6+ syntax (?., string interpolation, nameof, async/await) and no post-2017.3 Unity APIs (URP/HDRP, UI Toolkit, Input System, Addressables, DOTS)."
    why: "They do not compile on the pinned engine."
    adr: docs/architecture/adr-0001-engine-pin-unity-2017-3.md
    added: 2026-10-26
  - pattern: photon_app_id_in_git
    status: active
    description: "Never commit, fully log or put the Photon App ID in a tracked file; use WULFRAM_PHOTON_APPID or Assets/Resources/PhotonAppId.local.txt."
    why: "It is a credential; the repository may become public."
    adr: docs/architecture/adr-0002-pun-classic-photon-cloud.md
    added: 2026-10-26
  - pattern: local_destroy_of_networked_object
    status: active
    description: "In a room, never create or remove a networked object with plain Instantiate/Destroy; use PhotonNetwork.Instantiate/Destroy (local cleanup after leaving the room is the one exception)."
    why: "A plain Destroy leaves the object standing on every other client (the deploy preview ghost)."
    adr: docs/architecture/adr-0002-pun-classic-photon-cloud.md
    added: 2026-10-26
  - pattern: direct_cursor_write
    status: active
    description: "Never write Cursor.visible or Cursor.lockState outside InputMode (the gameplay test excepted); read the mode through InputMode.Driving."
    why: "Three writers and six readers shared the convention with no owner, and only one writer applied the lock (architecture review 4, G1)."
    adr: docs/architecture/adr-0006-hud-ui-and-input-mode.md
    added: 2026-10-27
  - pattern: ongui_hud_element
    status: active
    description: "Never add HUD elements with OnGUI; use Unity UI under HUDCanvas. MatchManager.OnGUI is the one exception until the HUD rework."
    why: "Two UI systems drew over each other (the match line over the status line)."
    adr: docs/architecture/adr-0006-hud-ui-and-input-mode.md
    added: 2026-10-27
  - pattern: client_owned_shared_unit
    status: active
    description: "Never create a unit other players can damage or use with PhotonNetwork.Instantiate on a player's client; ask the master, which creates it with InstantiateSceneObject."
    why: "PUN lets only the owner network-destroy an object, and it deletes a leaving player's objects (architecture review C1)."
    adr: docs/architecture/adr-0003-master-authority-and-team-identity.md
    added: 2026-10-26

