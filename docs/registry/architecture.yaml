#     revised: ""


# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: engine_and_language
    status: active
    api: "Unity 2017.3.0f3, C# 4 (Mono)"
    not: "post-2017.3 Unity APIs, C# 6+ syntax"
    adr: docs/architecture/adr-0001-engine-pin-unity-2017-3.md
    reason: "Binary scenes, PUN Classic and the proven gate all depend on this engine; upgrades are a deliberate step"
    referenced_by:
      - docs/architecture/adr-0001-engine-pin-unity-2017-3.md
      - docs/architecture/adr-0002-pun-classic-photon-cloud.md
    added: 2026-10-26
    revised: ""
  - purpose: networking
    status: active
    api: "PUN Classic 1.88 (PhotonNetwork.Instantiate/Destroy, [PunRPC]) on Photon Cloud; PhotonNetwork.offlineMode for offline play"
    not: "PUN2, UNet, Netcode for GameObjects"
    adr: docs/architecture/adr-0002-pun-classic-photon-cloud.md
    reason: "Works with today's Photon Cloud (M2); PUN2 needs Unity 2017.4.7+"
    referenced_by:
      - docs/architecture/adr-0002-pun-classic-photon-cloud.md
      - docs/architecture/adr-0003-master-authority-and-team-identity.md
      - docs/architecture/adr-0004-match-flow-matchmanager.md
    added: 2026-10-26
    revised: ""

